<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Natural Events Tracker</title>
    <!-- Leaflet CSS for the map styling -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { font-family: sans-serif; margin: 0; padding: 20px; text-align: center; }
        #map { height: 70vh; width: 90%; margin: 0 auto; border-radius: 8px; }
    </style>
</head>
<body>
    <h1>NASA EONET Tracker</h1>
    <div id="map"></div>

    <!-- Leaflet JS for the map logic -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Start the map centered on the equator
        const map = L.map('map').setView([20, 0], 2);

        // Load the map tiles (the actual map image)
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 18,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        // Fetch the data from your local FastAPI backend
        // When you deploy your backend to a platform like Render, update this URL
        fetch('https://fastapi-7y7t.onrender.com/')
            .then(response => response.json())
            .then(data => {
                data.events.forEach(event => {
                    // Place a pin on the map for every event
                    const marker = L.marker([event.lat, event.lon]).addTo(map);
                    // Add a popup with details when the pin is clicked
                    marker.bindPopup(`<b>${event.title}</b><br>Category: ${event.category}<br>Date: ${new Date(event.date).toLocaleDateString()}`);
                });
            })
            .catch(error => console.error('Error loading events:', error));
    </script>
</body>
</html>
